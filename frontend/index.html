<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Load Balancer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; padding: 20px; }
        .container { background: white; padding: 25px; max-width: 700px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #004080; }
        select { margin-top: 10px; padding: 10px; width: 100%; border-radius: 4px; border: 1px solid #ccc; }
        button { margin-top: 20px; padding: 12px 20px; background: #004080; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background: #003366; }
        pre { background: #1e1e1e; color: #00ff00; padding: 20px; border-radius: 5px; overflow-x: auto; font-size: 14px; min-height: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>☁️ Intelligent API Gateway</h2>
        <p>Connect from any device. The gateway will log your external IP and route traffic intelligently based on the live Latency Matrix.</p>
        
        <label><b>Select Workload Type:</b></label><br>
        <select id="reqType">
            <option value="query">Query (Routes to Lowest RTT / Fastest Network)</option>
            <option value="upload">Upload (Routes to Lowest CPU / Most Power)</option>
        </select>
        
        <button onclick="sendTraffic()">Transmit Request to Cloud</button>
        
        <h4 style="margin-top: 30px; border-bottom: 2px solid #eee; padding-bottom: 5px;">Live Webpage Logs:</h4>
        <pre id="output">Awaiting connection...</pre>
    </div>
    
    <script>
        // ⚠️ For GitHub documentation, you can leave this pointing to localhost or your Gateway IP
        const GATEWAY_URL = "http://localhost:8000"; 

        async function sendTraffic() {
            document.getElementById("output").innerText = "Aggregating latency matrix and computing route...";
            let type = document.getElementById("reqType").value;
            try {
                let res = await fetch(`${GATEWAY_URL}/request?type=${type}`);
                let data = await res.json();
                document.getElementById("output").innerText = JSON.stringify(data, null, 2);
            } catch(err) {
                document.getElementById("output").innerText = "Network Error: Could not reach the API Gateway.";
            }
        }
    </script>
</body>
</html>
